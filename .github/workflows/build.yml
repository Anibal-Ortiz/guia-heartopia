name: Compilar APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Verificar y compilar
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Obtener el código
        uses: actions/checkout@v7

      - name: Configurar JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4

      - name: Instalar plataforma 37 y Build-Tools
        run: sdkmanager --install "platforms;android-37" "build-tools;36.0.0" "build-tools;37.0.0"

      - name: Dar permisos de ejecución a Gradle
        run: chmod +x ./gradlew

      - name: Verificar manifiesto de release
        run: ./gradlew :app:verifyReleaseManifest --console=plain

      - name: Pruebas unitarias
        run: ./gradlew :app:testDebugUnitTest --console=plain

      - name: Lint
        run: ./gradlew :app:lintDebug --console=plain

      - name: Compilar la app
        run: ./gradlew :app:assembleDebug --console=plain

      - name: Obtener versión de la app
        id: version
        run: |
          VERSION=$(sed -n 's/^val appVersion = "\([^"]*\)"/\1/p' app/build.gradle.kts | head -n 1)
          if [ -z "$VERSION" ]; then
            echo "No se pudo leer appVersion de app/build.gradle.kts" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publicar el APK
        uses: actions/upload-artifact@v7
        with:
          name: GuiaHeartopia-${{ steps.version.outputs.version }}-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
