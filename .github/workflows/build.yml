name: Compilar APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: assembleDebug
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el código
        uses: actions/checkout@v7

      - name: Configurar JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4

      - name: Instalar plataforma 37 y Build-Tools
        run: sdkmanager --install "platforms;android-37" "build-tools;36.0.0" "build-tools;37.0.0"

      - name: Dar permisos de ejecución a Gradle
        run: chmod +x ./gradlew

      - name: Compilar la app
        run: ./gradlew assembleDebug

      - name: Publicar el APK
        uses: actions/upload-artifact@v7
        with:
          name: GuiaHeartopia-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
